# Ansible Inventory for Infrastructure Management
# This inventory defines the target hosts for DNS and HAProxy configuration

all:
  children:
    # HAProxy Load Balancers
    haproxy:
      hosts:
        haproxy-lb:
          ansible_host: 172.16.0.60
      vars:
        ansible_user: ansible
        ansible_become: true
        ansible_become_method: sudo
        haproxy_config_dir: /etc/haproxy
        haproxy_config_file: /etc/haproxy/haproxy.cfg
        haproxy_conf_d_dir: /etc/haproxy/conf.d

    # Bind9 DNS Servers
    dns:
      hosts:
        bind9-primary:
          ansible_host: 172.16.0.11
      vars:
        ansible_user: ansible
        ansible_become: true
        ansible_become_method: sudo
        bind9_zone_dir: /var/lib/bind
        bind9_zone_file: /var/lib/bind/db.webstorm.cloud
        bind9_named_conf: /etc/bind/named.conf.local

  vars:
    # Global connection settings
    ansible_connection: ssh
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    ansible_python_interpreter: /usr/bin/python3
