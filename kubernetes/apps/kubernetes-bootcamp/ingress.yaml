---
# Kubernetes Ingress for kubernetes-bootcamp application
# Uses Traefik IngressController (K3s default)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-bootcamp-ingress
  labels:
    app: kubernetes-bootcamp
    app.kubernetes.io/name: kubernetes-bootcamp
    app.kubernetes.io/managed-by: infrastructure-monorepo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: bootcamp.webstorm.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubernetes-bootcamp
                port:
                  number: 8080
